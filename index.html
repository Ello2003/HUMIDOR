  <head>
    <script>
      // Gracefully catch and log cross-origin and unhandled exceptions
      window.addEventListener('error', function (event) {
        if (!event.filename || event.message === 'Script error.') {
          console.warn('[The Humidor] Handled external/cross-origin script notification.');
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        console.warn('[The Humidor] Handled unhandled rejection:', event.reason);
      });
    </script>
