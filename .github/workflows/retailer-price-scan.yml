name: UK Retailer Price Scan

on:
  push:
    paths-ignore:
      - 'data/retailer-prices.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: retailer-price-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # Now that quotes are actually being matched (see v2.14.3), the scan
      # does real page-fetch work across ~24 retailers instead of discarding
      # every candidate. A little extra per-cigar parallelism keeps the run
      # inside the job timeout.
      PRICE_SCAN_CONCURRENCY: '4'
    steps:
      # FIRECRAWL_API_KEY is optional. The scanner has a zero-cost direct-web
      # fallback so price updates can continue without a paid Firecrawl plan.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run approved UK retailer product scan
        run: npm run scan:prices

      - name: Commit refreshed price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retailer-prices.json
          if git diff --cached --quiet; then
            echo "No retailer price changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh UK retailer prices"
          git push
