name: UK Retailer Price Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: retailer-price-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      # FIRECRAWL_API_KEY is optional. The scanner has a zero-cost direct-web
      # fallback so price updates can continue without a paid Firecrawl plan.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run direct Firecrawl price scan
        run: npm run scan:prices

      - name: Commit refreshed price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retailer-prices.json
          if git diff --cached --quiet; then
            echo "No retailer price changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh UK retailer prices"
          git push
