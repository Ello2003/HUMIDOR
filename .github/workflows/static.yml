# Build the Vite app and deploy the compiled output to GitHub Pages.
#
# This repo uses Bun (bun.lock is the committed lock file, not
# package-lock.json). Previous versions of this workflow uploaded the raw
# repository (`path: '.'`) with no build step at all -- so GitHub Pages
# served the unbuilt index.html, whose <script src="/src/main.tsx"> the
# browser can't execute (it's untranspiled TS/JSX), causing a 404. This
# version runs `vite build` (which uses the `base: '/HUMIDOR/'` production
# setting in vite.config.ts and rewrites all asset references correctly)
# and deploys only the resulting dist/ folder.
#
# Note: this deploys the static frontend only. GitHub Pages cannot run the
# Express/Gemini backend in server.ts, so any feature that calls /api/...
# will not work on this deployment -- those need a real Node host.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build static site
        run: bunx vite build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
